 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student GPA System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
   <body>

  <div class="container">

    <h1>Student GPA Management System</h1>

    <div class="input-section">
      <input type="text" placeholder="Course Name">

      <select>
        <option value="">Select Grade</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="F">F</option>
      </select>

      <input type="number" placeholder="Credit Hours">

      <button id="addBtn" type="button">Add Course</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Course</th>
          <th>Grade</th>
          <th>Credit</th>
          <th>Points</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
     <div class="cards">
       <div class="card">
    <h3>Final GPA</h3>
    <p id="gpaValue">0.00</p>
  </div>

  <div class="card">
    <h3>Total Credits</h3>
    <p id="totalCredits">0</p>
  </div>

  <div class="card">
    <h3>Total Points</h3>
    <p id="totalPoints">0</p>
  </div>

  
</div>
    <h2>Final GPA: --</h2>

  </div>

    <script src="script.js"></script>
</body>
</html>
